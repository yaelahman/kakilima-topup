<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" fill="none" aria-hidden="true">
  <!-- Isometric 3D gift/shopping box - fits store theme, works on primary background -->
  <defs>
    <linearGradient id="box-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.35)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0.12)"/>
    </linearGradient>
    <linearGradient id="box-right" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.2)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0.05)"/>
    </linearGradient>
    <linearGradient id="box-left" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.25)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0.08)"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="rgba(0,0,0,0.15)"/>
    </filter>
  </defs>
  <!-- Isometric box: top face -->
  <path d="M200 40 L340 120 L200 200 L60 120 Z" fill="url(#box-top)" filter="url(#soft-shadow)"/>
  <!-- Right face -->
  <path d="M340 120 L340 240 L200 320 L200 200 Z" fill="url(#box-right)"/>
  <!-- Left face -->
  <path d="M200 200 L200 320 L60 240 L60 120 Z" fill="url(#box-left)"/>
  <!-- Ribbon -->
  <path d="M200 80 L200 200 M80 140 L320 140" stroke="rgba(255,255,255,0.5)" stroke-width="8" stroke-linecap="round"/>
  <circle cx="200" cy="140" r="14" fill="rgba(255,255,255,0.4)"/>
</svg>
