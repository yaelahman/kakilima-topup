<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 280" fill="none" aria-hidden="true">
  <!-- Isometric-style gamepad - works on primary (orange) background -->
  <defs>
    <linearGradient id="gp-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.32)"/>
      <stop offset="50%" style="stop-color:rgba(255,255,255,0.18)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0.08)"/>
    </linearGradient>
    <linearGradient id="gp-grip" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.25)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0.06)"/>
    </linearGradient>
    <linearGradient id="gp-face" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.15)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0.35)"/>
    </linearGradient>
    <filter id="gp-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="rgba(0,0,0,0.2)"/>
    </filter>
  </defs>
  <!-- Main body (rounded rect isometric) -->
  <path d="M40 100 L40 180 Q40 200 60 200 L260 200 Q280 200 280 180 L280 100 Q280 80 260 80 L60 80 Q40 80 40 100 Z" fill="url(#gp-body)" filter="url(#gp-shadow)"/>
  <!-- Left grip -->
  <path d="M20 120 L40 100 L40 180 L20 160 Q20 140 20 120 Z" fill="url(#gp-grip)"/>
  <!-- Right grip -->
  <path d="M280 100 L300 120 Q300 140 300 160 L280 180 L280 100 Z" fill="url(#gp-grip)"/>
  <!-- D-pad -->
  <path d="M80 140 L100 140 L100 160 L80 160 Z" fill="rgba(255,255,255,0.5)"/>
  <path d="M70 130 L90 130 L90 150 L70 150 Z" fill="rgba(255,255,255,0.35)"/>
  <!-- Face buttons (diamond) -->
  <circle cx="220" cy="130" r="14" fill="rgba(255,255,255,0.45)"/>
  <circle cx="240" cy="145" r="14" fill="rgba(255,255,255,0.35)"/>
  <circle cx="220" cy="160" r="14" fill="rgba(255,255,255,0.4)"/>
  <circle cx="200" cy="145" r="14" fill="rgba(255,255,255,0.35)"/>
  <!-- Stick nubs -->
  <circle cx="120" cy="155" r="12" fill="url(#gp-face)"/>
  <circle cx="180" cy="125" r="12" fill="url(#gp-face)"/>
  <!-- Center logo area -->
  <ellipse cx="160" cy="145" rx="18" ry="8" fill="rgba(255,255,255,0.2)"/>
</svg>
